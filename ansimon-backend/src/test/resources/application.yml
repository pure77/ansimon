spring:
  ai:
    vectorstore:
      type: none
  datasource:
    url: jdbc:h2:mem:ansimon-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

ansimon:
  internal:
    api-keys:
      - test-internal-key-current-0000000000
      - test-internal-key-previous-000000000
  auth:
    jwt-secret: test-jwt-secret-0000000000000000000000
    access-token-ttl: 1h
